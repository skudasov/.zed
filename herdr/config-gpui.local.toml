# Herdr UI (desktop app) configuration — source of truth lives here in
# ~/.config/zed/herdr/config-gpui.local.toml.
# Install: `just configs` from ~/.config/zed (copies to ~/.config/herdr/).
# Edits made in Herdr UI's Settings, or with `Herdr config set`, land in the
# installed copy and are overwritten on install: copy them back here.
# Unset keys inherit ~/.config/herdr/config-gpui.toml (the app's documented
# defaults); tables merge key by key.
#
# Shared with the TUI, in herdr/config.toml:
#   - colors: theme = "Follow Herdr" uses its [theme] / [theme.custom]
#   - cmd+2 pull requests <-> workspaces: a [[keys.command]],
#     since only the daemon's keys can run a shell command

# Minimal chrome: status + name rows, no status bar. The activity bar stays,
# since Pull requests, Issues and Overview only open while it is shown.
layout = "minimal"
tab_layout = "underline"
confirm_close_pane = false
theme = "Follow Herdr"
show_agents = false
show_sidebar_search = false
show_repository_icons = false
show_device_icons = false
show_system_load = false
show_listening_ports = false

# cmd-1 toggles the sidebar, like the TUI's toggle_sidebar = "cmd+1" in
# config.toml. Taking cmd-1 here removes it from focus_tab_1.
# cmd-2 is freed for the pull requests <-> workspaces key in config.toml.
[keybindings]
toggle_sidebar = ["cmd-1", "cmd-b"]
focus_tab_2 = []

# Fonts match Zed: JetBrains Mono 15. The sidebar uses the Light face, since
# only [terminal] takes a weight.
[sidebar]
activity_bar = true
device_footer = "never"
automations = false
family = "JetBrains Mono Light"
size = 15

[tabs]
family = "JetBrains Mono"
size = 15

[terminal]
family = "JetBrains Mono"
size = 15
weight = "regular"

[ui]
family = "JetBrains Mono"
size = 15

[worktrees]
apply_to = []

[status_bar]
show = false

[usage]
topbar = false
