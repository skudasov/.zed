# Pick a PR from the repos in ~/.config/herdr/review.toml — review requests
# first, with draft/checks/conflict status — then a prompt template, and review
# it in a fresh agent. Both pickers run in the quick-actions overlay.
name = "Review: PR inbox"
description = "Watched repos' PRs, needs-my-review first"
type = "select"
command = "~/.config/herdr/bin/ai-review.ts inbox {{.Value}} '{{.WorkDir}}'"

[[options]]
label = "claude"
value = "claude"

[[options]]
label = "opencode"
value = "opencode"
