# Pick one of the markdown snippets in ~/.config/herdr/skill-snippets/ and copy
# it to the clipboard. The fzf picker runs inside the overlay pane (real tty),
# so the action needs no further input from the quick-actions launcher.
name = "skill-snippet"
description = "Pick a snippet and copy it to the clipboard"
type = "command"
command = "~/.config/herdr/bin/skill-snippet.ts"